services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8081:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
    env_file:
      # Inject securely configured environment variables from J.A.R.V.I.S
      - ${HOME}/.jarvish/.env
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped
